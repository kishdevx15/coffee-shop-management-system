{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | KishCraft Coffee</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="{% static 'css/theme.css' %}">

<style>
  body.kc {
    background: linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--cream); width: 100%; max-width: 380px;
    border-radius: var(--radius-lg); padding: 36px 32px;
    box-shadow: var(--shadow-lift);
  }
  .login-header { text-align: center; margin-bottom: 26px; }
  .login-header .icon-circle {
    width: 58px; height: 58px; border-radius: 50%; background: var(--maroon);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
  }
  .login-header .icon-circle i { font-size: 26px; color: var(--gold-light); }
  .login-header h1 { font-family: var(--font-display); font-size: 20px; color: var(--maroon); margin: 0; }
  .login-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  .error-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--danger-bg); color: var(--danger-text);
    padding: 10px 14px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; margin-bottom: 18px;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .input-wrap {
    display: flex; align-items: center; gap: 10px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 0 14px; background: var(--card);
  }
  .input-wrap i { color: var(--text-muted); font-size: 16px; }
  .input-wrap input {
    flex: 1; border: none; outline: none; background: none;
    height: 48px; font-size: 14.5px; font-family: var(--font-body); color: var(--text);
  }
  .toggle-pass { background: none; border: none; cursor: pointer; color: var(--text-muted); }

  .login-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body class="kc">

<div class="login-card">
  <div class="login-header">
    <div class="icon-circle"><i class="ti ti-coffee"></i></div>
    <h1>KishCraft Coffee</h1>
    <p>Kitchen Dashboard Staff Login</p>
  </div>

  {% if form.errors or error %}
  <div class="error-box">
    <i class="ti ti-alert-circle"></i>
    <span>Invalid username or password. Please try again.</span>
  </div>
  {% endif %}

  <form method="POST" action="{% url 'staff_login' %}">
    {% csrf_token %}

    <div class="form-group">
      <label for="username">Username</label>
      <div class="input-wrap">
        <i class="ti ti-user"></i>
        <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <i class="ti ti-lock"></i>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <button type="button" class="toggle-pass" onclick="togglePassword()">
          <i class="ti ti-eye" id="toggleIcon"></i>
        </button>
      </div>
    </div>

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit" class="kc-btn kc-btn-primary">
      <i class="ti ti-login"></i> Login
    </button>
  </form>

  <div class="login-footer">
    &copy; {% now "Y" %} KishCraft Coffee &mdash; Staff Access Only
  </div>
</div>

<script>
function togglePassword() {
  const pass = document.getElementById('password');
  const icon = document.getElementById('toggleIcon');
  if (pass.type === 'password') {
    pass.type = 'text';
    icon.classList.remove('ti-eye');
    icon.classList.add('ti-eye-off');
  } else {
    pass.type = 'password';
    icon.classList.remove('ti-eye-off');
    icon.classList.add('ti-eye');
  }
}
</script>

</body>
</html>
