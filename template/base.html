{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KishCraft Coffee{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="kc">

<div class="kc-shell">

    {% block content %}{% endblock %}

    <div class="kc-nav">
        <a href="{% url 'search' %}" class="{% if active_nav == 'search' %}active{% endif %}">
            <i class="ti ti-search"></i>
            <span>Search</span>
        </a>
        <a href="{% url 'order_status_session' %}" class="{% if active_nav == 'orders' %}active{% endif %}">
            <i class="ti ti-clipboard-list"></i>
            <span>Orders</span>
        </a>
    </div>

</div>

{% block extra_js %}{% endblock %}

</body>
</html>
