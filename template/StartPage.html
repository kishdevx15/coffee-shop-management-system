{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KishCraft Coffee</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/theme.css' %}">

    <style>
        .start-shell {
            max-width: 402px; margin: 0 auto; min-height: 100vh;
            background: linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 40px 28px; text-align: center;
        }
        .start-badge-wrap {
            position: relative; width: 84px; height: 84px;
            margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;
        }
        .start-badge-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 1.5px solid rgba(212,175,90,0.35);
            animation: ringPulse 2.8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50%      { transform: scale(1.12); opacity: 0; }
        }
        .steam { position: absolute; top: -14px; width: 3px; height: 14px; border-radius: 3px;
            background: rgba(250,245,234,0.55); filter: blur(0.5px);
            animation: steamRise 2.4s ease-in-out infinite;
            pointer-events: none;
        }
        .steam:nth-child(2) { left: 26px; animation-delay: 0s; }
        .steam:nth-child(3) { left: 40px; animation-delay: 0.6s; }
        .steam:nth-child(4) { left: 54px; animation-delay: 1.2s; }
        @keyframes steamRise {
            0%   { transform: translateY(0) scaleX(1);   opacity: 0; }
            30%  { opacity: 0.7; }
            100% { transform: translateY(-16px) scaleX(1.6); opacity: 0; }
        }
        .start-badge {
            position: relative; width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(145deg, var(--gold-light) 0%, var(--gold) 55%, #a97e26 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 18px rgba(201,152,47,0.45), inset 0 2px 4px rgba(255,255,255,0.35);
            overflow: hidden;
            flex-shrink: 0;
        }
        .start-badge img {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .start-title {
            font-family: var(--font-display); font-weight: 700;
            font-size: 40px; color: var(--cream); margin: 0;
        }
        .start-sub {
            font-family: var(--font-display); font-weight: 600;
            font-size: 20px; color: var(--gold-light); margin: 6px 0 22px;
            letter-spacing: .02em;
        }
        .start-par {
            font-family: var(--font-body); font-size: 14px; line-height: 1.6;
            color: rgba(250,245,234,0.75); max-width: 320px; margin-bottom: 32px;
        }
        .start-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--gold); color: var(--maroon-dark);
            font-family: var(--font-body); font-weight: 700; font-size: 15px;
            padding: 14px 32px; border-radius: 999px; border: none; cursor: pointer;
        }
        .start-btn:hover { background: var(--gold-light); }
    </style>
</head>
<body class="kc" style="background: var(--maroon-dark);">

    <div class="start-shell">
        <form method="get" action="Table-booking">
            <div class="start-badge-wrap">
                <div class="start-badge-ring"></div>
                <span class="steam"></span>
                <span class="steam"></span>
                <span class="steam"></span>
                <div class="start-badge">
                    <img src="{% static 'images/coff9.png' %}" alt="KishCraft Coffee">
                </div>
            </div>
            <h1 class="start-title">KishCraft</h1>
            <div class="start-sub">Fresh on the menu</div>
            <p class="start-par">"At KishCraft, coffee isn't just a drink — it's an experience. From the first pour to the last sip, every cup is crafted with passion. Discover freshness on the menu and let every sip spark your story."</p>
            <button class="start-btn" type="submit">Order Now →</button>
        </form>
    </div>

</body>
</html>
