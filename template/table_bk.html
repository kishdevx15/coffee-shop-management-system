{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Booking</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/theme.css' %}">

    <style>
        .tb-shell {
            max-width: 402px; margin: 0 auto; min-height: 100vh;
            background: linear-gradient(160deg, var(--maroon) 0%, var(--maroon-dark) 100%);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 24px; padding: 40px 20px;
        }
        .tb-head {
            font-family: var(--font-display); font-weight: 700;
            font-size: 24px; color: var(--cream); text-align: center; margin: 0;
        }
        .tb-box {
            width: 100%; background: var(--cream);
            border-radius: var(--radius-lg); padding: 26px 22px 30px;
        }
        .tb-row { display: flex; gap: 10px; }
        .tb-input.half { flex: 1; }
        .tb-error {
            font-size: 12.5px; font-weight: 600; color: var(--danger-text);
            display: none; margin: 10px 0 4px; padding-left: 4px;
        }
    </style>
</head>
<body class="kc" style="background: var(--maroon-dark);">

<div class="tb-shell">

    <h1 class="tb-head">"Confirm &amp; enjoy."</h1>

    <form method="POST" action="{% url 'user_data' %}" id="tableForm" class="tb-box">
        {% csrf_token %}

        <input type="text" name="name" class="kc-input" placeholder="Enter your name" required style="margin-bottom:14px;">

        <div class="tb-row">
            <input type="text" name="tbn" class="kc-input half" placeholder="Table number" required>
        </div>

        {% if error %}
            <p class="tb-error" style="display:block;">{{ error }}</p>
        {% else %}
            <p class="tb-error" id="tbErrorMsg"></p>
        {% endif %}

        <button type="submit" class="kc-btn kc-btn-gold" id="submitBtn" style="margin-top:14px;">Confirm table</button>

    </form>

</div>

<script>
    let inp = document.querySelector('input[name="tbn"]');
    let box = document.getElementById('tbErrorMsg');
    let form = document.getElementById("tableForm");
    let submitBtn = document.getElementById("submitBtn");

    let tables = JSON.parse('{{ tables_json|escapejs }}');

    if (inp && box) {
        inp.addEventListener("input", function () {
            let value = inp.value.trim();

            if (value === "") { box.style.display = "none"; return; }

            let num = parseInt(value);

            if (isNaN(num) || num <= 0 || num > 20) {
                box.style.display = "block";
                box.innerText = "Invalid table number ❌";
                return;
            }

            if (tables.includes(num)) {
                box.style.display = "block";
                box.innerText = "Table already taken ❌";
            } else {
                box.style.display = "none";
            }
        });
    }

    form.addEventListener("submit", function (e) {
        if (submitBtn.disabled) { e.preventDefault(); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = "Booking...";
    });
</script>

</body>
</html>
