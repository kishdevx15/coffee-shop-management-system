{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Booking</title>

    <link rel="stylesheet" href="{% static 'css/style2.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1 class="head">"Confirm &amp; enjoy."</h1>

    <form method="POST" action="{% url 'user_data' %}" id="tableForm">
        {% csrf_token %}

        <div class="inner-box">

            <img src="{% static 'img/img6 1.png' %}" class="corner-img" alt="">

            <input type="text" name="name" class="nm" placeholder="Enter your name" required>
            <input type="text" name="tbn" class="tb-n" placeholder="Table number" required>

            {% if error %}
                <p class="mini" style="display:block;">{{ error }}</p>
            {% else %}
                <p class="mini"></p>
            {% endif %}

            <button type="submit" class="but" id="submitBtn">Confirm table</button>

        </div>

    </form>

</div>

<script>
    let inp = document.querySelector(".tb-n");
    let box = document.querySelector(".mini");
    let form = document.getElementById("tableForm");
    let submitBtn = document.getElementById("submitBtn");

    let tables = JSON.parse('{{ tables_json|escapejs }}');

    inp.addEventListener("input", function () {
        let value = inp.value.trim();

        if (value === "") {
            box.style.display = "none";
            return;
        }

        let num = parseInt(value);

        if (isNaN(num) || num <= 0 || num > 20) {
            box.style.display = "block";
            box.innerText = "Invalid table number ❌";
            return;
        }

        let exists = tables.includes(num);

        if (exists) {
            box.style.display = "block";
            box.innerText = "Table already taken ❌";
        } else {
            box.style.display = "none";
        }
    });

    form.addEventListener("submit", function (e) {
        if (submitBtn.disabled) {
            e.preventDefault();
            return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "Booking...";
    });
</script>

</body>
</html>
