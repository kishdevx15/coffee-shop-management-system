{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KishCraft Coffee — Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">

    <style>
        .pd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
        .pd-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px; text-align: center;
        }
        .pd-card img { width: 100%; height: 92px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 8px; }
        .pd-title { font-size: 14px; font-weight: 600; color: var(--text); }
        .pd-desc { font-size: 11.5px; color: var(--text-muted); margin: 3px 0 8px; min-height: 14px; }
        .pd-price { font-family: var(--font-display); font-weight: 700; color: var(--maroon); margin-bottom: 8px; }
        .pd-explore-btn {
            width: 100%; background: var(--maroon); color: var(--gold-light);
            border: none; padding: 9px; border-radius: var(--radius-sm);
            font-weight: 700; font-size: 12.5px; cursor: pointer;
        }

        .pd-popup-overlay {
            display: none; position: fixed; inset: 0; background: rgba(38,12,15,0.55);
            align-items: flex-end; justify-content: center; z-index: 200;
        }
        .pd-popup-card {
            background: var(--cream); width: 100%; max-width: 402px;
            border-radius: 22px 22px 0 0; padding: 24px 22px 30px; text-align: center;
        }
        .pd-qty-box { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 16px 0 20px; }
        .pd-qty-box button {
            width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
            background: var(--card); font-size: 18px; cursor: pointer; color: var(--maroon);
        }
        .pd-close-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 13px; margin-top: 10px; cursor: pointer;
        }

        .pd-toast {
            display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--success-bg); color: var(--success-text);
            padding: 10px 20px; border-radius: 999px; font-weight: 600; font-size: 13.5px; z-index: 300;
        }
    </style>
</head>

<body class="kc">

<div class="kc-shell" style="padding-bottom: 40px;">

    <div class="kc-topbar">
        <button type="button" onclick="window.history.back()" class="kc-back">← Back</button>
        <h1 style="margin:0;">Coffee Menu</h1>
        <span style="width:70px;"></span>
    </div>

    <input type="text" class="kc-input search-input" placeholder="Search your favorite coffee...">

    <div class="pd-grid">
        {% for product in products %}
        <div class="pd-card product-card">
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
            <div class="pd-title product-title">{{ product.name }}</div>
            <div class="pd-desc">{{ product.description }}</div>
            <div class="pd-price">₹{{ product.price }}</div>
            <button
                class="pd-explore-btn"
                data-id="{{ product.id }}"
                data-name="{{ product.name }}"
                data-price="{{ product.price }}"
                onclick="openBox(this)">
                Add
            </button>
        </div>
        {% endfor %}
    </div>

</div>

<div class="pd-popup-overlay" id="orderBox">
    <div class="pd-popup-card">
        <h2 class="coffee-name" style="font-family:var(--font-display); color:var(--maroon);"></h2>
        <p class="coffee-price" style="color:var(--text-muted); margin-top:4px;"></p>

        <div class="pd-qty-box">
            <button type="button" onclick="decreaseQty()">−</button>
            <span class="qty-number" style="font-weight:700; font-size:18px;">1</span>
            <button type="button" onclick="increaseQty()">+</button>
        </div>

        <input type="hidden" id="product_id">
        <input type="hidden" id="quantity_input">

        <button type="button" class="kc-btn kc-btn-primary" onclick="addToCart()">Add to Cart</button>
        <button type="button" onclick="closeBox()" class="pd-close-btn">Close</button>
    </div>
</div>

<div id="toast" class="pd-toast">Added to cart ✔</div>

<script>
let quantity = 1;

function openBox(btn){
    document.getElementById("orderBox").style.display = "flex";
    document.querySelector(".coffee-name").innerText = btn.dataset.name;
    document.querySelector(".coffee-price").innerText = "₹" + btn.dataset.price;
    document.getElementById("product_id").value = btn.dataset.id;

    quantity = 1;
    document.querySelector(".qty-number").innerText = quantity;
    document.getElementById("quantity_input").value = quantity;
}

function increaseQty(){
    quantity++;
    document.querySelector(".qty-number").innerText = quantity;
    document.getElementById("quantity_input").value = quantity;
}

function decreaseQty(){
    if(quantity > 1){
        quantity--;
        document.querySelector(".qty-number").innerText = quantity;
        document.getElementById("quantity_input").value = quantity;
    }
}

function closeBox(){
    document.getElementById("orderBox").style.display = "none";
}

function showToast(msg){
    let toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 2000);
}

function addToCart(){
    let productId = document.getElementById("product_id").value;
    let qty = document.getElementById("quantity_input").value;

    fetch("{% url 'add_to_cart' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: "product_id=" + productId + "&quantity=" + qty
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === "success"){
            showToast("Added to cart ✔");
            closeBox();
        } else {
            showToast("Failed ❌");
        }
    })
    .catch(() => showToast("Network error ❌"));
}

document.querySelector(".search-input").addEventListener("input", function(){
    let value = this.value.toLowerCase();
    document.querySelectorAll(".product-card").forEach(card => {
        let title = card.querySelector(".product-title").innerText.toLowerCase();
        card.style.display = title.includes(value) ? "block" : "none";
    });
});
</script>

</body>
</html>
