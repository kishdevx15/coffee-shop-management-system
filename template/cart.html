{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">

  <style>
    .ct-empty { text-align: center; padding: 5rem 1rem; color: var(--text-muted); }
    .ct-empty svg { margin-bottom: 1rem; opacity: 0.4; }

    .ct-list { display: flex; flex-direction: column; gap: 10px; margin: 18px 0; }
    .ct-item {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 14px 16px; display: flex; align-items: center; gap: 14px;
    }
    .ct-name {
      flex: 1; font-size: 15px; font-weight: 600; color: var(--text);
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ct-price { font-size: 13px; color: var(--text-muted); white-space: nowrap; min-width: 84px; text-align: right; }
    .ct-price strong { display: block; font-size: 15px; font-weight: 700; color: var(--text); }
    .ct-qty { display: flex; align-items: center; gap: 8px; }
    .ct-qty-btn {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--cream); color: var(--maroon); font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .ct-qty-val { font-size: 0.9rem; font-weight: 700; min-width: 20px; text-align: center; }

    .ct-divider { height: 1px; background: var(--border); margin: 6px 0 16px; }
    .ct-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding: 0 2px; }
    .ct-total-label { font-size: 14px; color: var(--text-muted); }
    .ct-total-amount { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--maroon); }

    .ct-error {
      display: none; margin-top: 12px; background: var(--danger-bg); color: var(--danger-text);
      border-radius: var(--radius-sm); padding: 11px 16px; font-size: 0.875rem; font-weight: 500;
    }
  </style>
</head>
<body class="kc">
<div class="kc-shell">

  <div class="kc-topbar">
    <a href="javascript:history.back()" class="kc-back">← Back</a>
    <h1 style="margin:0;">Your cart</h1>
  </div>

  {% if cart_items %}
    <div class="ct-list" id="item-list">
      {% for item in cart_items %}
      <div class="ct-item" id="item-{{ item.id }}">
        <span class="ct-name">{{ item.product.name }}</span>
        <div class="ct-qty">
          <button class="ct-qty-btn" onclick="changeQty({{ item.id }}, {{ item.product.price }}, -1)" aria-label="Decrease">−</button>
          <span class="ct-qty-val" id="qty-{{ item.id }}">{{ item.quantity }}</span>
          <button class="ct-qty-btn" onclick="changeQty({{ item.id }}, {{ item.product.price }}, 1)" aria-label="Increase">+</button>
        </div>
        <div class="ct-price">
          <span>₹{{ item.product.price }} × <span id="qty-label-{{ item.id }}">{{ item.quantity }}</span></span>
          <strong id="line-{{ item.id }}">₹0.00</strong>
        </div>
      </div>
      {% endfor %}
    </div>

    <div class="ct-divider" id="divider"></div>

    <div class="ct-total-row" id="total-row">
      <span class="ct-total-label">Total</span>
      <span class="ct-total-amount">₹<span id="total-val">0.00</span></span>
    </div>

    <button class="kc-btn kc-btn-primary" id="submit-btn" onclick="submitOrder()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span id="submit-btn-text">Submit order</span>
    </button>
    <div class="ct-error" id="ct-error"></div>
    <div class="kc-toast" id="toast"></div>

  {% else %}
    <div class="ct-empty">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 001.98 1.61h9.72a2 2 0 001.98-1.61L23 6H6"/>
      </svg>
      <p>Your cart is empty.</p>
    </div>
  {% endif %}

</div>

<script>
  const CSRF = "{{ csrf_token }}";

  const itemData = {
    {% for item in cart_items %}
    "{{ item.id }}": { price: parseFloat("{{ item.product.price }}"), qty: {{ item.quantity }} },
    {% endfor %}
  };

  function recalcTotal() {
    let total = 0;
    for (const id in itemData) total += itemData[id].price * itemData[id].qty;
    const el = document.getElementById("total-val");
    if (el) el.textContent = total.toFixed(2);
  }

  for (const id in itemData) {
    const el = document.getElementById("line-" + id);
    if (el) el.textContent = "₹" + (itemData[id].price * itemData[id].qty).toFixed(2);
  }
  recalcTotal();

  async function changeQty(itemId, price, delta) {
    const current = itemData[itemId] ? itemData[itemId].qty : 1;
    const newQty  = current + delta;

    if (newQty <= 0) {
      const res = await fetch("/cart/remove/" + itemId + "/", {
        method: "POST",
        headers: { "X-CSRFToken": CSRF },
      });
      if (res.ok) {
        const card = document.getElementById("item-" + itemId);
        if (card) card.remove();
        delete itemData[itemId];
        recalcTotal();
        if (Object.keys(itemData).length === 0) location.reload();
      }
      return;
    }

    const res = await fetch("/cart/update/" + itemId + "/", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF },
      body: JSON.stringify({ quantity: newQty }),
    });

    if (res.ok) {
      itemData[itemId].qty = newQty;
      document.getElementById("qty-" + itemId).textContent       = newQty;
      document.getElementById("qty-label-" + itemId).textContent = newQty;
      document.getElementById("line-" + itemId).textContent      = "₹" + (price * newQty).toFixed(2);
      recalcTotal();
    }
  }

  async function submitOrder() {
    const btn     = document.getElementById("submit-btn");
    const btnText = document.getElementById("submit-btn-text");
    const errBox  = document.getElementById("ct-error");

    errBox.style.display = "none";
    btn.disabled = true;
    btnText.textContent = "Placing order…";

    try {
      const res = await fetch("/cart/place-order/", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF },
        body: JSON.stringify({}),
      });

      let data = null;
      try { data = await res.json(); } catch (e) { /* no json body */ }

      if (res.ok) {
        document.getElementById("item-list").innerHTML  = "";
        document.getElementById("divider").style.display    = "none";
        document.getElementById("total-row").style.display  = "none";
        btn.style.display = "none";
        const toast = document.getElementById("toast");
        toast.style.display = "block";
        toast.innerHTML = "&#10003; Order placed! Your barista is on it.";
      } else {
        btn.disabled = false;
        btnText.textContent = "Submit order";
        // Surface the real reason instead of a generic message, so bugs are easy to spot.
        const reason = (data && (data.error || data.detail)) || (res.status + " " + res.statusText);
        errBox.textContent = "Couldn't place order: " + reason;
        errBox.style.display = "block";
      }
    } catch (networkErr) {
      btn.disabled = false;
      btnText.textContent = "Submit order";
      errBox.textContent = "Network error — check your connection and try again.";
      errBox.style.display = "block";
    }
  }
</script>
</body>
</html>
