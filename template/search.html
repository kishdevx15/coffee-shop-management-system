{% extends 'base.html' %}
{% load static %}

{% block title %}Search — KishCraft Coffee{% endblock %}

{% block extra_css %}
<style>
    .sr-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .sr-card {
        display: flex; align-items: center; gap: 14px;
        background: var(--card); border: 1px solid var(--border);
        border-radius: var(--radius-md); padding: 12px 14px;
    }
    .sr-icon { width: 54px; height: 54px; border-radius: 14px; overflow: hidden; background: var(--border); flex-shrink: 0; }
    .sr-icon img { width: 100%; height: 100%; object-fit: cover; }
    .sr-info { flex: 1; min-width: 0; }
    .sr-name { font-weight: 600; font-size: 15px; }
    .sr-price { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .sr-arrow { background: none; border: none; font-size: 22px; color: var(--gold); cursor: pointer; }
    .sr-empty { color: var(--text-muted); font-size: 14px; text-align: center; padding: 30px 0; }

    .pd-popup-overlay {
        display: none; position: fixed; inset: 0; background: rgba(38,12,15,0.55);
        align-items: flex-end; justify-content: center; z-index: 200;
    }
    .pd-popup-card {
        background: var(--cream); width: 100%; max-width: 402px;
        border-radius: 22px 22px 0 0; padding: 24px 22px 30px; text-align: center;
    }
    .pd-qty-box { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 16px 0 20px; }
    .pd-qty-box button {
        width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border);
        background: var(--card); font-size: 18px; cursor: pointer; color: var(--maroon);
    }
    .pd-close-btn { background: none; border: none; color: var(--text-muted); font-size: 13px; margin-top: 10px; cursor: pointer; }
    .pd-toast {
        display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        background: var(--success-bg); color: var(--success-text);
        padding: 10px 20px; border-radius: 999px; font-weight: 600; font-size: 13.5px; z-index: 300;
    }
</style>
{% endblock %}

{% block content %}

<div class="kc-topbar">
    <div>
        <div class="eyebrow">Find your cup</div>
        <h1>Search Menu</h1>
    </div>
</div>

<input type="text" id="productSearch" class="kc-input" placeholder="Search coffee, shakes, desserts...">

<div class="kc-section-label" style="margin-top:16px;">
    Results
    <span class="count" id="resultCount">0</span>
</div>

<div class="sr-list" id="searchResults">
    <p class="sr-empty">Start typing to search the menu.</p>
</div>

<div class="pd-popup-overlay" id="orderBox">
    <div class="pd-popup-card">
        <h2 class="coffee-name" style="font-family:var(--font-display); color:var(--maroon);"></h2>
        <p class="coffee-price" style="color:var(--text-muted); margin-top:4px;"></p>

        <div class="pd-qty-box">
            <button type="button" onclick="decreaseQty()">−</button>
            <span class="qty-number" style="font-weight:700; font-size:18px;">1</span>
            <button type="button" onclick="increaseQty()">+</button>
        </div>

        <input type="hidden" id="product_id">
        <input type="hidden" id="quantity_input">

        <button type="button" class="kc-btn kc-btn-primary" onclick="addToCart()">Add to Cart</button>
        <button type="button" onclick="closeBox()" class="pd-close-btn">Close</button>
    </div>
</div>

<div id="toast" class="pd-toast">Added to cart ✔</div>

{% endblock %}

{% block extra_js %}
<script>
    const input   = document.getElementById('productSearch');
    const results = document.getElementById('searchResults');
    const count   = document.getElementById('resultCount');

    let timer = null;
    let quantity = 1;

    input.addEventListener('input', function () {
        clearTimeout(timer);
        let query = this.value.trim();

        if (query.length === 0) {
            results.innerHTML = '<p class="sr-empty">Start typing to search the menu.</p>';
            count.innerText = '0';
            return;
        }

        timer = setTimeout(() => runSearch(query), 300);
    });

    function runSearch(query) {
        fetch("{% url 'search' %}?q=" + encodeURIComponent(query), {
            headers: { "X-Requested-With": "XMLHttpRequest" }
        })
        .then(res => res.json())
        .then(data => {
            count.innerText = data.products.length;

            if (data.products.length === 0) {
                results.innerHTML = '<p class="sr-empty">No matches found.</p>';
                return;
            }

            results.innerHTML = data.products.map(p => `
                <div class="sr-card">
                    <div class="sr-icon"><img src="${p.image_url}" alt="${p.name}"></div>
                    <div class="sr-info">
                        <div class="sr-name">${p.name}</div>
                        <div class="sr-price">₹${p.price}</div>
                    </div>
                    <button
                        type="button"
                        class="sr-arrow"
                        data-id="${p.id}"
                        data-name="${p.name}"
                        data-price="${p.price}"
                        onclick="openBox(this)">
                        ›
                    </button>
                </div>
            `).join('');
        })
        .catch(() => { results.innerHTML = '<p class="sr-empty">Something went wrong. Try again.</p>'; });
    }

    function openBox(btn) {
        document.getElementById('orderBox').style.display = 'flex';
        document.querySelector('.coffee-name').innerText  = btn.dataset.name;
        document.querySelector('.coffee-price').innerText = '₹' + btn.dataset.price;
        document.getElementById('product_id').value = btn.dataset.id;

        quantity = 1;
        document.querySelector('.qty-number').innerText = quantity;
        document.getElementById('quantity_input').value = quantity;
    }

    function increaseQty() {
        quantity++;
        document.querySelector('.qty-number').innerText = quantity;
        document.getElementById('quantity_input').value = quantity;
    }

    function decreaseQty() {
        if (quantity > 1) {
            quantity--;
            document.querySelector('.qty-number').innerText = quantity;
            document.getElementById('quantity_input').value = quantity;
        }
    }

    function closeBox() {
        document.getElementById('orderBox').style.display = 'none';
    }

    function showToast(msg) {
        let toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    function addToCart() {
        let productId = document.getElementById('product_id').value;
        let qty       = document.getElementById('quantity_input').value;

        fetch("{% url 'add_to_cart' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: "product_id=" + productId + "&quantity=" + qty
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                showToast("Added to cart ✔");
                closeBox();
            } else {
                showToast("Failed ❌");
            }
        })
        .catch(() => showToast("Network error ❌"));
    }
</script>
{% endblock %}
